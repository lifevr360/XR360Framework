<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>M One Tower | VR Walkthrough</title>
    <style>
        /* Base reset to fill viewport and block scrollbars */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Luxury Overlay with High-Contrast Background Darkening */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.60), rgba(0, 0, 0, 0.80)), url('JW_JAIRJ_Skyloft_Terrace_Tower_Twilight.jpg') center / cover no-repeat;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .brand-title {
            font-size: 34px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 400;
            margin-bottom: 8px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .brand-subtitle {
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #A39E98; /* High-contrast Charcoal 405 U */
            margin-bottom: 40px;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        /* Scaled Progress Bar Elements */
        .progress-container {
            width: 320px;
            max-width: 85%;
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 18px;
            border: 1px solid rgba(0, 0, 0, 0.5);
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #A39E98; /* High-contrast Charcoal 405 U */
            box-shadow: 0 0 12px #A39E98;
            transition: width 0.15s ease-out;
        }

        .progress-text {
            font-size: 14px;
            letter-spacing: 2.5px;
            color: #FFFFFF;
            text-transform: uppercase;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        /* Prominent Pulsing Play Button */
        .play-button {
            width: 90px;
            height: 90px;
            border: 3px solid #A39E98; /* High-contrast Charcoal 405 U */
            border-radius: 50%;
            display: none; /* Revealed once 100% loaded */
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            cursor: pointer;
            animation: pulse 2s infinite;
            background: rgba(0, 0, 0, 0.5);
        }

        .play-triangle {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 24px solid #A39E98; /* High-contrast Charcoal 405 U */
            margin-left: 5px;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(163, 158, 152, 0.6);
            }

            70% {
                transform: scale(1.08);
                box-shadow: 0 0 0 22px rgba(163, 158, 152, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(163, 158, 152, 0);
            }
        }

        /* Unity Banner Container */
        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translate(-50%, 0);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            z-index: 10000;
            text-align: center;
            font-size: 13px;
            border-radius: 4px;
            overflow: hidden;
        }

        /* Unity WebGL Canvas */
        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            position: fixed;
            top: 0;
            left: 0;
            background: url('Main.jpg') center / cover;
        }

        .fade-out {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- Combined Loading & Interaction Overlay -->
    <div id="loading-overlay">
        <div class="brand-title">M1 TOWERS</div>
        <div id="brand-subtitle" class="brand-subtitle">VR WALKTHROUGH</div>

        <div id="play-btn" class="play-button">
            <div class="play-triangle"></div>
        </div>

        <div id="progress-box" class="progress-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <div id="progress-text" class="progress-text">LOADING EXPERIENCE 0%</div>
    </div>

    <!-- Unity Warning/Error Banner Container -->
    <div id="unity-warning"></div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script>
        const overlay = document.querySelector('#loading-overlay');
        const canvas = document.querySelector("#unity-canvas");
        const progressFill = document.querySelector('#progress-fill');
        const progressText = document.querySelector('#progress-text');
        const progressBox = document.querySelector('#progress-box');
        const playBtn = document.querySelector('#play-btn');
        const brandSubtitle = document.querySelector('#brand-subtitle');

        // Banner error/warning presentation function
        function unityShowBanner(msg, type) {
            var warningBanner = document.querySelector("#unity-warning");
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: #d9534f; color: white; padding: 10px; margin: 4px; border-radius: 4px;';
            else {
                if (type == 'warning') div.style = 'background: #f0ad4e; color: black; padding: 10px; margin: 4px; border-radius: 4px;';
                setTimeout(function () {
                    if (div.parentNode === warningBanner) {
                        warningBanner.removeChild(div);
                        updateBannerVisibility();
                    }
                }, 5000);
            }
            updateBannerVisibility();
        }

        // Configure viewport metadata for touch responsiveness
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.body.style.textAlign = "left";
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/M1 Towers.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/M1 Towers.data",
            frameworkUrl: buildUrl + "/M1 Towers.framework.js",
            codeUrl: buildUrl + "/M1 Towers.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "LifeVR",
            productName: "M1 Towers",
            productVersion: "0.1",
            showBanner: unityShowBanner,
        };

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                // Live download percentage updates (0.0 to 1.0)
                const percentage = Math.round(progress * 100);
                progressFill.style.width = percentage + "%";
                progressText.innerText = "LOADING EXPERIENCE " + percentage + "%";
            }).then((unityInstance) => {
                console.log("Unity instance successfully loaded.");

                // Switch UI state upon completion
                progressBox.style.display = "none";
                progressText.innerText = "CLICK ANYWHERE TO EXPLORE";
                brandSubtitle.innerText = "EXPERIENCE READY";
                playBtn.style.display = "flex";

                // User gesture unlocks browser autoplay audio & video rules
                overlay.addEventListener('click', function () {
                    overlay.classList.add('fade-out');
                });
            }).catch((message) => {
                alert("Error loading application: " + message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
